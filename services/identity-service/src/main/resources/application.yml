spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8081}
identity:
  oauth2:
    issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081}
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5173/callback}
    patient-service-client-secret: ${PATIENT_SERVICE_CLIENT_SECRET}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    com.medicare.identity: DEBUG